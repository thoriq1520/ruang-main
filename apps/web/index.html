<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4fbf8" />
    <style>
      .skip-link{position:fixed;z-index:1000;top:8px;left:8px;transform:translateY(-160%)}
      .skip-link:focus{padding:12px 16px;border-radius:12px;color:#161d1b;background:#fff;transform:translateY(0)}
      .app-loading{width:min(calc(100% - 40px),1240px);margin:12px auto;display:grid;gap:22px}
      .loading-block{overflow:hidden;background:#dcece6}
      .loading-block::after{content:"";display:block;width:100%;height:100%;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.58) 50%,transparent 70%);transform:translateX(-100%);animation:loading-sweep 1.35s ease-in-out infinite}
      .loading-header{height:82px;border-radius:999px;background:#fff}
      .loading-hero{height:290px;border-radius:32px;background:#bce4d8}
      .loading-title{width:150px;height:26px;margin-top:20px;border-radius:10px}
      .loading-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
      .loading-card{height:230px;border-radius:20px;background:#fff}
      @keyframes loading-sweep{to{transform:translateX(100%)}}
      @media(max-width:720px){.app-loading{width:calc(100% - 24px)}.loading-header{border-radius:22px}.loading-hero{height:296px;border-radius:24px}.loading-cards{grid-template-columns:repeat(2,1fr)}.loading-card:nth-child(n+3){display:none}}
      @media(prefers-reduced-motion:reduce){.loading-block::after{display:none}}
    </style>
